name: Build and Push Image

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git describe 需要完整的 tag 历史；默认 fetch-depth=1 只有单个 commit，
          # 拿不到 tag，版本号会退化成短 SHA（Issue #26 的遗留问题）。
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            # 发版 tag（vX.Y.Z）推送时，额外给镜像打一个固定版本标签，便于 pin 版本，
            # 避免只能依赖会漂移的 :latest。仅 tag 事件（github.ref_name 形如 v1.1.4）会匹配。
            type=match,pattern=v\d+\.\d+\.\d+

      - name: Compute version (tag 优先，回退短 SHA)
        id: ver
        run: |
          # 与 Makefile 保持同一套取值约定：
          #   - HEAD 正好在 tag 上        → v1.1.3
          #   - 领先 tag N 个 commit      → v1.1.3-N-g<sha>
          #   - 仓库无 tag / git 不可用   → 短 commit SHA
          V=$(git describe --tags --always 2>/dev/null || true)
          if [ -z "$V" ]; then V="${GITHUB_SHA::7}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "resolved VERSION=$V"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
